name: routine-scheduler-darwin-launchd

request: |
  macOSでMaintenance Routineの日次scheduleを--scheduler autoで確認して。

# macOSのautoがlaunchd（user LaunchAgent）を選ぶことを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_run:
    - bash tools/manage-routine-schedule.sh --routine maintenance --scheduler auto --at 03:00 --print
  must_report:
    - scheduler=launchd
    - user-launchagent-not-launchdaemon
