name: ambiguous-target-no-broad-scan

request: |
  市場レビューProjectを進めて。

expect:
  route: project
  must_search:
    command: tools/find-context.sh
    status: active
  max_candidates: 3
  max_read_files: 12
  must_read:
    - AGENTS.md
    - projects/README.md
  must_report:
    - candidate-metadata-and-clarification
