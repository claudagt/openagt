name: meta-read-no-full-validator

request: |
  tools/backup-to-github.sh が停止するreasonの分類を説明して。変更はしないで。

# meta Routeであることはfull validatorの理由にならない。read classの照会は
# 検証・commit・backupを一切起こさない。
expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/BACKUP.md
  must_not_run:
    - bash tools/validate-agent-directory.sh --full
    - bash tools/validate-agent-directory.sh
    - git commit
    - bash tools/backup-to-github.sh
    - git push
  must_report:
    - stop-reason-classification
  must_not_write:
    - tools/**
    - evals/**
