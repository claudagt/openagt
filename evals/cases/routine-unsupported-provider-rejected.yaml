name: routine-unsupported-provider-rejected

request: |
  AGENT_ROUTINE_REASONING_PROVIDER=someothervendor が設定されたWorkspaceで
  Maintenance Routineを実行して。

# サポート外Providerを拒否し、別Providerへ自動fallbackしないことを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_not_run:
    - python3 tools/routine-reasoner.py --request
  must_report:
    - unsupported-provider-rejected
    - no-fallback-to-another-provider
    - deterministic-phase-still-completed
