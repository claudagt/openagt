name: project-finite-completion

fixture: finite-project

request: |
  projects/site-migration/ の成果物を完成・検証し、有限Projectを完了状態まで進めて。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/PROJECTS.md
    - projects/site-migration/PROJECT.md
    - projects/site-migration/STATE.md
    - projects/site-migration/inputs/routes.txt
    - projects/site-migration/scripts/verify-migration.sh
  must_update:
    - projects/site-migration/PROJECT.md
    - projects/site-migration/STATE.md
  must_run:
    - bash projects/site-migration/scripts/verify-migration.sh
  must_set:
    - projects/site-migration/PROJECT.md#status=completed
    - projects/site-migration/STATE.md#現在の目標=なし（Project完了）
    - projects/site-migration/STATE.md#次の一手=なし（Project完了）
  must_preserve:
    - projects/site-migration/PROJECT.md#目的
    - projects/site-migration/PROJECT.md#最終ゴール
    - projects/site-migration/PROJECT.md#完了条件
    - projects/site-migration/PROJECT.md#判断原則
  may_write:
    - projects/site-migration/PROJECT.md
    - projects/site-migration/STATE.md
    - projects/site-migration/outputs/migration-summary.md
    - .tmp/**
  must_not_write:
    - knowledge/raw/internal/**
    - knowledge/raw/external/**
    - skills/**
