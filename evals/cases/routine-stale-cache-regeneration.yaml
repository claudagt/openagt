name: routine-stale-cache-regeneration

request: |
  context cacheがstaleな状態でMaintenance Routineを実行して。

# stale cacheは既存Toolで1回だけ再生成し、独自のcacheロジックを再実装しないことを検証する。
expect:
  route: meta
  must_read:
    - AGENTS.md
    - routines/ROUTINES.md
  must_run:
    - bash tools/build-context-cache.sh --check-routing
    - bash tools/build-context-cache.sh
  must_report:
    - cache-regenerated-once-from-canon
  must_not_write:
    - knowledge/**
