name: routine-sandbox-failure-not-applied

request: |
  推論モデルの修復候補が隔離snapshotのvalidator検証に失敗した。

# isolated verificationに失敗した候補をreal working treeへ適用しないことを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_not_run:
    - git commit
  must_report:
    - candidate-discarded-after-isolated-verification-failure
    - real-tree-unchanged
  must_not_write:
    - '**'
