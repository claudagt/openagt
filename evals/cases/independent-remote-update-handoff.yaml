name: independent-remote-update-handoff

fixture: independent-project

request: |
  projects/data-pipeline/repository/ のpipelineを直して、検証が通ったら採用revisionを更新しておいて。

# Independent repositoryへの通常pushが許可され、rootへのpushは許可されないことを1ケースで検証する。
expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/PROJECTS.md                # remote操作の境界は詳細正本が所有する
    - projects/data-pipeline/PROJECT.md
    - projects/data-pipeline/STATE.md
  must_run:
    - git -C projects/data-pipeline/repository commit
    - git -C projects/data-pipeline/repository push origin
    - git -C projects/data-pipeline/repository ls-remote --heads origin
  must_not_run:
    - git push                                    # root remoteへは決してpushしない
    - bash tools/backup-to-github.sh              # backupは利用者の明示時だけ
    - git -C projects/data-pipeline/repository pull
    - git -C projects/data-pipeline/repository merge
    - git -C projects/data-pipeline/repository rebase
    - git -C projects/data-pipeline/repository push --force
  must_report:
    - root-fetch-pull-push-prohibition-applies-to-the-root-repository-only
    - independent-normal-push-is-allowed-from-the-independent-session-root
    - verify-then-commit-then-push-then-confirm-sha-on-remote
    - sha-and-verification-handed-off-before-any-root-write
    - root-state-updated-by-a-separate-root-session
  must_update:
    - projects/data-pipeline/STATE.md   # 採用revisionはhandoff後にroot sessionが更新する
  must_not_write:
    - projects/data-pipeline/PROJECT.md
    - .gitignore
  must_not_modify:
    - AGENTS.md
