name: project-context-must-read

fixture: active-project

request: |
  projects/market-scan/ の四半期レポート作成を進めて。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
    - projects/market-scan/inputs/quarter.csv
  must_not_read:
    - projects/PROJECTS.md    # 通常のProject実行では詳細正本を無条件に読まない
  must_update:
    - projects/market-scan/STATE.md
  may_write:
    - projects/market-scan/outputs/**
    - projects/market-scan/STATE.md
    - .tmp/**
  must_not_modify:
    - projects/market-scan/PROJECT.md
