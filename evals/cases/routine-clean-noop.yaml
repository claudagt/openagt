name: routine-clean-noop

request: |
  cleanな正常状態のWorkspaceでMaintenance Routineを実行して。

# 異常もtracked変更もない実行はNOOPとし、API・commit・backupを行わないことを検証する。
expect:
  route: meta
  must_read:
    - AGENTS.md
    - routines/ROUTINES.md
  must_run:
    - bash tools/run-routine.sh maintenance
  must_not_run:
    - git commit
    - bash tools/backup-to-github.sh
    - git push
    - python3 tools/routine-reasoner.py --request
  must_report:
    - ROUTINE_NOOP
  must_not_write:
    - STATE.md
    - knowledge/wiki/LOG.md
