name: project-layered-entry

fixture: active-project

request: |
  projects/market-scan/ の四半期レポートを1本進めて、検証まで終わらせて。

expect:
  route: project
  max_read_files: 12
  max_context_bytes: 32768
  must_read:                            # ルート → Project共通層 → Project差分 → 契約 → 状態の順
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
  must_not_read:
    - projects/PROJECTS.md                # 新設・状態遷移・repository modeのいずれでもない
    - projects/LIFECYCLE.md
    - projects/RECOVERY.md
    - tools/BACKUP.md
  must_update:
    - projects/market-scan/STATE.md
  must_run:
    - bash projects/market-scan/scripts/verify-report.sh
  may_write:
    - projects/market-scan/outputs/**
    - projects/market-scan/STATE.md
    - .tmp/**
  must_not_modify:
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md
