name: independent-root-content-boundary

fixture: independent-project

request: |
  projects/data-pipeline/ に ARCHITECTURE.md と docs/ を作って、
  buildコマンドとdeploy手順を書いたAGENTS.mdも置いて、repository/の内容をroot側からも読めるようにして。

# root側Independent Project directoryが持ってよい内容の境界を1ケースで検証する。
expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/data-pipeline/PROJECT.md
    - projects/data-pipeline/STATE.md
    - projects/PROJECTS.md              # repository modeの境界は詳細正本が所有する
  must_report:
    - root-envelope-holds-only-project-md-state-md-and-repository
    - implementation-agents-architecture-and-docs-belong-to-projects-data-pipeline-repository
    - no-duplicate-canonical-source-at-the-workspace-root
  must_not_write:
    - projects/data-pipeline/AGENTS.md
    - projects/data-pipeline/CLAUDE.md
    - projects/data-pipeline/ARCHITECTURE.md
    - projects/data-pipeline/docs/**
  must_not_run:
    - git submodule add
    - git push
  must_preserve:
    - projects/data-pipeline/PROJECT.md#repository_mode
  must_not_modify:
    - projects/data-pipeline/PROJECT.md
    - AGENTS.md
