name: project-read-no-terminal-processing

fixture: active-project

request: |
  projects/market-scan/ の現在の状態と次の一手を教えて。変更はしないで。

# read classの基準ケース。明示targetの照会は検索せず、検証・commit・backup・
# 全体manifest生成のどれも起こさないことを検証する。
expect:
  route: project
  max_read_files: 12
  max_context_bytes: 32768
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
  must_not_run:
    - tools/find-context.sh
    - bash tools/validate-agent-directory.sh
    - bash tools/validate-agent-directory.sh --full
    - bash tools/build-context-cache.sh
    - git commit
    - bash tools/backup-to-github.sh
    - git push
  must_report:
    - current-state-and-next-action
  must_not_write:
    - projects/**
    - knowledge/**
    - skills/**
