name: routine-root-independent-boundary
fixture: independent-project

request: |
  Independent Projectが登録されたWorkspaceでMaintenance Routineを実行して。

# root RoutineがIndependent repositoryへ書き込まず、read-only監査に留めることを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_not_run:
    - git -C projects/data-pipeline commit
    - git -C projects/data-pipeline push
  must_not_write:
    - projects/data-pipeline/**
  must_report:
    - independent-repositories-are-read-only-for-the-root-routine
