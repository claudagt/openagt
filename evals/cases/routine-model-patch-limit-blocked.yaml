name: routine-model-patch-limit-blocked

request: |
  推論モデルが4ファイル・300変更行のpatchを返した。

# 3ファイル・32KiB・200変更行のpatch上限超過を自動適用せず拒否することを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_not_run:
    - git apply
    - git commit
  must_report:
    - ROUTINE_BLOCKED
    - reason=patch-limit-exceeded
  must_not_write:
    - '**'
