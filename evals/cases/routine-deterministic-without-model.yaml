name: routine-deterministic-without-model

request: |
  推論ProviderもAPIキーも未設定のまま、Maintenance Routineを実行して。

# モデル未設定でも決定的Maintenanceが完了し、推論層だけをunconfiguredとして区別することを検証する。
expect:
  route: meta
  must_read:
    - AGENTS.md
    - routines/ROUTINES.md
  must_run:
    - bash tools/run-routine.sh maintenance
  must_not_run:
    - curl
    - python3 tools/routine-reasoner.py --request
  must_report:
    - deterministic-maintenance-completed
    - reasoning-layer-reported-as-disabled-or-unconfigured-not-as-error
