name: routine-reasoning-disabled-offline

request: |
  AGENT_ROUTINE_REASONING_ENABLED=false のままMaintenance Routineを実行して。
  validatorはFAILを出している。

# reasoning無効時は診断があっても外部Providerへ一切通信しないことを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_not_run:
    - python3 tools/routine-reasoner.py --request
    - curl
  must_report:
    - reasoning=disabled
    - no-external-transmission
