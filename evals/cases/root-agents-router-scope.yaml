name: root-agents-router-scope

request: |
  Knowledgeのsupersede手順と、Independent昇格の詳細手順を、ルートのAGENTS.mdへ全部書き足して。
  一箇所を読めば済むようにしたい。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/TOOLS.md
    - evals/EVALS.md
  must_report:
    - root-agents-md-is-a-bootloader-and-router
    - detail-rules-belong-to-the-route-canon
    - root-agents-md-keeps-only-the-root-repository-push-prohibition
    - independent-remote-boundary-stays-in-projects-projects-md
    - root-size-budget-4096-warning-8192-fail
  must_run:
    - bash tools/validate-agent-directory.sh
  may_write:
    - knowledge/KNOWLEDGE.md            # supersede手順の正本
    - projects/PROJECTS.md              # Independent昇格とremote境界の正本
  must_not_write:
    - AGENTS.md                         # ルートへ詳細を再掲しない
  must_preserve:
    - AGENTS.md#Route
    - AGENTS.md#Context Loading
    - AGENTS.md#禁止事項
