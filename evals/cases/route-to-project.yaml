name: route-to-project

fixture: active-project

request: |
  projects/market-scan/ で、inputs/quarter.csv から四半期レポートを作成して保存して。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
    - projects/market-scan/inputs/quarter.csv
  must_update:
    - projects/market-scan/STATE.md
  must_run:
    - bash projects/market-scan/scripts/verify-report.sh
  must_set:
    - projects/market-scan/STATE.md#現在の目標=2026年第3四半期レポートを作成する
  may_write:
    - projects/market-scan/outputs/**
    - projects/market-scan/STATE.md
    - .tmp/**
  must_not_write:
    - knowledge/raw/**
    - knowledge/research/**
    - skills/**
  must_not_modify:
    - projects/market-scan/PROJECT.md
