name: routine-schedule-install-explicit

request: |
  Maintenance Routineを毎日03:00に動かしたい。まず何が登録されるか見せて。

# Scheduler installが明示操作であり、通常のRoutine実行やprintがOS scheduleを変更しないことを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_run:
    - bash tools/manage-routine-schedule.sh --routine maintenance --scheduler auto --at 03:00 --print
  must_not_run:
    - bash tools/manage-routine-schedule.sh --routine maintenance --scheduler auto --at 03:00 --install
    - crontab -
    - launchctl bootstrap
  must_report:
    - install-requires-an-explicit-user-action
