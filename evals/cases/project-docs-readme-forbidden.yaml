name: project-docs-readme-forbidden

fixture: docs-project

request: |
  projects/design-system/docs/ に README.md を置いて、中の文書を一覧できるようにして。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/design-system/AGENTS.md
    - projects/design-system/PROJECT.md
    - projects/design-system/STATE.md
  must_report:
    - docs-is-entered-through-uppercase-domain-canon-not-a-readme
  must_run:
    - bash tools/validate-agent-directory.sh
  must_not_write:
    - projects/design-system/docs/README.md
    - projects/design-system/docs/NOTES.md
    - projects/design-system/docs/MISC.md
  must_preserve:
    - projects/design-system/AGENTS.md#Project Docs Route
