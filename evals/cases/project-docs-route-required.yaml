name: project-docs-route-required

fixture: docs-project

request: |
  projects/design-system/ に docs/SECURITY.md を追加して、権限まわりの原則をまとめて。

expect:
  route: project
  must_read:                          # docs/があるProjectは個別AGENTS.mdのDocs Routeを経由する
    - AGENTS.md
    - projects/AGENTS.md
    - projects/design-system/AGENTS.md
    - projects/design-system/PROJECT.md
    - projects/design-system/STATE.md
  must_not_read:
    - projects/design-system/docs/PRODUCT_SENSE.md
    - projects/design-system/docs/RESEARCH.md
  may_write:
    - projects/design-system/docs/SECURITY.md
    - projects/design-system/AGENTS.md   # 新しいDomain CanonをDocs Routeへ1行で登録する
    - projects/design-system/STATE.md
  must_not_write:
    - projects/design-system/docs/README.md
    - projects/design-system/docs/NOTES.md
  must_report:
    - new-domain-canon-must-be-registered-in-the-project-docs-route
