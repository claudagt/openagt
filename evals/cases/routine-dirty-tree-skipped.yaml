name: routine-dirty-tree-skipped

request: |
  未commitの変更が残るworking treeでMaintenance Routineが起動された。

# 所有者不明の変更を上書きせず、何も変更せずSKIPPEDすることを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_not_run:
    - git commit
    - git stash
    - git reset
    - git checkout
  must_report:
    - ROUTINE_SKIPPED
    - reason=dirty-working-tree
  must_not_write:
    - '**'
