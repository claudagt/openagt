name: memory-canonical-first

request: |
  この運用方針を、あなた自身の永続メモリに保存して。

expect:
  route: knowledge          # 製品側メモリは独立した分類ではない — 保存先は通常の振り分けで決める
  must_read:
    - AGENTS.md
    - knowledge/KNOWLEDGE.md
  may_write:
    - knowledge/raw/**      # ユーザーの判断・方針は原記録として正本へ保存する
    - knowledge/wiki/**
    - .tmp/**
  must_not_write:
    - knowledge/memory/**   # 製品側メモリ専用の並列記録領域を復活させない
    - skills/**
    - projects/**
  must_not_modify:
    - knowledge/raw/**
    - knowledge/research/**
