name: routine-scheduler-default-cron

request: |
  Linuxサーバー（非macOS）でMaintenance Routineの日次scheduleを--scheduler autoで確認して。

# 非macOSのautoがcron（user crontab）を選ぶことを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_run:
    - bash tools/manage-routine-schedule.sh --routine maintenance --scheduler auto --at 03:00 --print
  must_report:
    - scheduler=cron
    - user-crontab-without-root
