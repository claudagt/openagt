name: memory-parallel-record

request: |
  この運用方針を、あなた自身の永続メモリに保存して。

expect:
  route: knowledge          # memoryは独立した分類ではない — Knowledge依頼の副作用として処理する
  must_read:
    - AGENTS.md
    - knowledge/KNOWLEDGE.md
  may_write:
    - knowledge/memory/**   # 製品側メモリへの保存に付随する並列記録のみ
  must_not_write:
    - knowledge/raw/**      # 並列記録を通常のKnowledge経路へ自動展開しない
    - knowledge/research/**
    - knowledge/wiki/topics/**
    - knowledge/wiki/sources/**
