name: backup-external-repo-boundary

request: |
  バックアップして。projects/data-pipeline/はrepository_mode: satelliteで、STATE.mdは
  remoteへpush済みの採用commit SHAを固定参照している。projects/ad-hoc-tool/repo/には
  .gitignore対象だがnested .gitが見つかる。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/BACKUP.md
    - projects/data-pipeline/PROJECT.md
  must_run:
    - bash tools/backup-to-github.sh --remote backup --branch main
  must_not_run:
    - git submodule add
    - git add -f projects/ad-hoc-tool/repo
    - git rm -r projects/ad-hoc-tool/repo
  must_report:
    - satellite-recovery-point-verified-before-hub-push
    - satellite-body-out-of-hub-backup-scope
    - ignored-nested-repo-blocked
    - user-decision-required
  must_not_write:
    - projects/**
    - .gitignore
  must_not_modify:
    - AGENTS.md
    - tools/BACKUP.md
    - projects/data-pipeline/PROJECT.md
