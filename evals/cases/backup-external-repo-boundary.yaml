name: backup-external-repo-boundary

request: |
  バックアップして。projects/data-pipeline/PROJECT.mdは外部リポジトリを宣言済みで、
  作業cloneはagent-directoryの外にある。projects/ad-hoc-tool/repo/には
  宣言のないネストGitリポジトリが見つかる。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/BACKUP.md
    - projects/data-pipeline/PROJECT.md
  must_run:
    - bash tools/backup-to-github.sh --remote backup --branch main
  must_not_run:
    - git submodule add
    - git add -f projects/ad-hoc-tool/repo
    - git rm -r projects/ad-hoc-tool/repo
  must_report:
    - declared-external-repo-out-of-scope
    - undeclared-nested-repo-blocked
    - user-decision-required
  must_not_write:
    - projects/**
    - .gitignore
  must_not_modify:
    - AGENTS.md
    - tools/BACKUP.md
    - projects/data-pipeline/PROJECT.md
