name: research-question-to-project

request: |
  どのモデル構成が一番安く同じ精度を出せるのか、実際に比較して答えを出して。

expect:
  route: project                      # 新しい問いへの答えを調査・実験で見つける依頼はProject
  must_search:
    command: tools/find-context.sh
    status: active
  max_candidates: 5
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
  may_write:
    - projects/**                     # 研究文書はdocs/RESEARCH.mdまたはdocs/research/が持つ
    - .tmp/**
  must_not_write:
    - knowledge/wiki/**               # 未確定の調査結果をRoot Knowledgeへ書かない
    - knowledge/raw/internal/**
    - knowledge/raw/external/**
  must_report:
    - research-lives-in-project-docs-until-promotion-criteria-are-met
