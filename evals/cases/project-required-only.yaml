name: project-required-only
fixture: context-search

request: |
  projects/market-review/ の現在判断を作って。歴史監査は不要です。

expect:
  route: project
  max_read_files: 12
  max_context_bytes: 32768
  must_read:
    - AGENTS.md
    - projects/README.md
    - projects/market-review/PROJECT.md
    - projects/market-review/STATE.md
    - knowledge/wiki/topics/capital-allocation-current.md
  must_not_read:
    - knowledge/wiki/topics/capital-allocation-history.md
