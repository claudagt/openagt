name: research-method-to-skill

request: |
  今後どの調査でも同じ手順で使えるように、文献レビューのやり方を手順として作っておいて。

expect:
  route: skill                        # 再利用可能な研究方法そのものはSkill
  must_read:
    - AGENTS.md
    - skills/SKILLS.md
  may_write:
    - skills/**
    - .tmp/**
  must_not_write:
    - projects/**                     # 具体的な研究活動と混ぜない
    - knowledge/raw/internal/**
    - knowledge/raw/external/**
    - skills/_template/**
