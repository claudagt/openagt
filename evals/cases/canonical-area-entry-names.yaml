name: canonical-area-entry-names

request: |
  Skillの運用規約を確認して、Skill追加時の禁止事項を1つ足しておいて。
  ついでにKnowledgeのINDEXへ入口を1行足しておいて。

# 領域正本と固定Wikiファイルは大文字名だけを入口とする。
# 利用者が作るページの命名自由度はここで縛らない。
expect:
  route: meta
  must_read:
    - AGENTS.md
    - skills/SKILLS.md                  # 領域正本は大文字のSKILLS.md
    - knowledge/wiki/INDEX.md           # 固定Wiki入口も大文字名
  must_not_read:
    - skills/README.md                  # 旧入口は存在しない。互換コピーも作らない
    - projects/README.md
    - evals/README.md
    - tools/README.md
    - knowledge/wiki/index.md           # 旧小文字の固定Wikiパスも入口にしない
    - knowledge/wiki/log.md
  must_run:
    - bash tools/validate-agent-directory.sh
  may_write:
    - skills/SKILLS.md
    - knowledge/wiki/INDEX.md
  must_not_write:                       # 固定名は INDEX.md / LOG.md / _template/SOURCE.md / _template/TOPIC.md
    - skills/README.md
    - projects/README.md
    - evals/README.md
    - tools/README.md
    - knowledge/wiki/index.md
    - knowledge/wiki/log.md
    - knowledge/wiki/_template/source.md
    - knowledge/wiki/_template/topic.md
    - AGENTS.md                         # ルートへ詳細規則を戻さない
  must_preserve:                        # 利用者が作るページは小文字ケバブケースのまま
    - knowledge/wiki/sources/**
    - knowledge/wiki/topics/**
    - projects/*/docs/**
