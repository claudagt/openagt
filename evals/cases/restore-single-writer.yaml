name: restore-single-writer

request: |
  新しいマシンへ移行したい。Private backupから復旧して、こちらを稼働側にして。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/TOOLS.md
    - tools/BACKUP.md
  must_run:
    - git clone <private-agent-repository> <new-directory>
    - git ls-remote --heads backup main
    - bash tools/validate-agent-directory.sh
    - bash tools/build-context-cache.sh
  must_not_run:
    - git pull
    - git merge
    - git rebase
    - git push --force
  must_report:
    - remote-sha-matches-local-head
    - secrets-restored-out-of-band
    - old-machine-read-only-until-promotion
  must_not_write:
    - knowledge/raw/internal/**
    - knowledge/raw/external/**
  must_not_modify:
    - AGENTS.md
    - tools/BACKUP.md
