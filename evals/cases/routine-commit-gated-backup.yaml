name: routine-commit-gated-backup

request: |
  Maintenance Routineが低リスク修復を検証済みcommitとして確定した。backup remoteは設定済み。

# tracked変更の検証済みcommit後だけ既存backup policyへ進み、scheduleだけではbackupしないことを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_run:
    - git commit
    - bash tools/backup-to-github.sh --root-only
  must_not_run:
    - git push origin
  must_report:
    - ROUTINE_OK
    - commit-sha
    - backup-followed-existing-event-driven-trigger
